<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield Aura -->
  <path d="M50 8 L85 24 V50 C85 71 69 88 50 94 C31 88 15 71 15 50 V24 Z" 
        fill="url(#shieldGrad)" opacity="0.25" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- AI Radar Rings -->
  <circle cx="50" cy="48" r="32" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="50" cy="48" r="22" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 2"/>

  <!-- Cloud -->
  <path d="M36 56 C32 56 28 53 28 48 C28 44 31 41 35 41 C36 34 42 29 49 29 C56 29 62 34 63 41 C67 42 70 45 70 49 C70 53 66 56 62 56 Z" 
        fill="url(#cloudGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>

  <!-- Lightning Bolt -->
  <path d="M47 48 L41 58 H48 L46 68 L57 55 H50 L53 48 Z" fill="url(#boltGrad)" filter="drop-shadow(0 0 8px #fbbf24)"/>

  <!-- AI Sparkles -->
  <polygon points="72,25 74,30 79,32 74,34 72,39 70,34 65,32 70,30" fill="#38bdf8"/>
  <polygon points="26,30 27,33 30,34 27,35 26,38 25,35 22,34 25,33" fill="#a855f7"/>

  <!-- Location Pin Dot at Bottom -->
  <circle cx="50" cy="80" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="80" r="7" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
</svg>
